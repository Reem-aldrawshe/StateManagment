allprojects {
    repositories {
         maven { url "https://maven.aliyun.com/repository/google" }  // بديل google()
        maven { url "https://maven.aliyun.com/repository/central" } // بديل mavenCentral()
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
